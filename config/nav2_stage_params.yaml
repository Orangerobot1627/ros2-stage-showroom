amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: robot_1/base_link
    odom_frame_id: robot_1/odom
    global_frame_id: map
    scan_topic: base_scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 11.5
    laser_likelihood_max_dist: 2.0
    max_beams: 45
    min_particles: 200
    max_particles: 800
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.15
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 2.3
      y: -14.5
      z: 0.0
      yaw: 1.57079632679

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: robot_1/base_link
    odom_topic: odom
    bt_loop_duration: 20
    default_server_timeout: 50
    # Jazzy defaults this to 50 ms. VMware plus 3x Stage time needs longer
    # for FollowPath to stop and return its result during pause/cancel.
    default_cancel_timeout: 1000
    wait_for_service_timeout: 2000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 12.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.30
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      # Pickup, delivery and standby are position goals. The tray does not
      # need a fixed final heading, and a strict yaw goal can leave NavFn
      # replanning after the position path has already been consumed.
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.50
      lookahead_dist: 0.60
      min_lookahead_dist: 0.40
      max_lookahead_dist: 0.90
      lookahead_time: 1.4
      rotate_to_heading_angular_vel: 0.80
      transform_tolerance: 0.30
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.70
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.12
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.65
      max_angular_accel: 2.5
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 6.0
      publish_frequency: 2.0
      global_frame: robot_1/odom
      robot_base_frame: robot_1/base_link
      # Headless Stage can advance simulated time much faster than DDS
      # discovery. This timeout is only used while the costmap first waits
      # for odom -> base_link; normal transform tolerances stay strict.
      initial_transform_timeout: 500.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.38
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: base_scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.05
          obstacle_max_range: 7.0
          obstacle_min_range: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.58
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: robot_1/base_link
      initial_transform_timeout: 500.0
      resolution: 0.05
      robot_radius: 0.38
      track_unknown_space: false
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: base_scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.05
          obstacle_max_range: 7.0
          obstacle_min_range: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.58
      always_send_full_costmap: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.35
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 8.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: robot_1/odom
    global_frame: map
    robot_base_frame: robot_1/base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.90
    min_rotational_vel: 0.20
    rotational_acc_lim: 2.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 15.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.55, 0.0, 1.10]
    min_velocity: [-0.25, 0.0, -1.10]
    max_accel: [0.60, 0.0, 2.10]
    max_decel: [-0.75, 0.0, -2.10]
    odom_topic: odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: robot_1/base_link
    odom_frame_id: robot_1/odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.30
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 3
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: base_scan
      min_height: 0.0
      max_height: 2.0
      enabled: true
